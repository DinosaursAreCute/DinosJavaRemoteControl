# Remote Control Configuration
# Number of slots/buttons on the remote
remote.slots.count=20

# Command Duration Settings
# Global default duration for all commands in milliseconds (0.25 seconds)
command.duration.default.ms=250

# Log when commands are executing with their duration (for debugging/verification)
command.duration.logExecution=true

# Optional per-command duration overrides (uncomment to use)
# Format: command.duration.<CommandClassName>.ms=<milliseconds>
# Examples:
# command.duration.LightOnCommand.ms=300
# command.duration.MacroCommand.ms=500

# ===== MACRO DEFINITIONS =====
# Format: macro.<macroId>.on.commands=Cmd1,Cmd2,Cmd3
# Format: macro.<macroId>.off.commands=Cmd1,Cmd2,Cmd3
# Macros are registered as first-class commands in the registry

macro.partyMode.on.commands=LightOnCommand,StereoOnCommand,StereoPlayCDCommand
macro.partyMode.off.commands=StereoStopPlaybackCommand,StereoOffCommand,LightOffCommand

macro.movieNight.on.commands=LightOnCommand,StereoOnCommand,StereoPlayCDCommand
macro.movieNight.off.commands=StereoStopPlaybackCommand,StereoOffCommand,LightOffCommand

macro.allOff.on.commands=LightOffCommand,StereoOffCommand,GarageDownCommand
macro.allOff.off.commands=LightOnCommand,StereoOnCommand,GarageUpCommand

# 20-Step Test Macro - Duration: 20 * 250ms = 5 seconds total
# Tests progress bar visualization over longer duration
macro.testLongTask.on.commands=LightOnCommand,StereoOnCommand,StereoPlayCDCommand,StereoVolumeUpCommand,StereoVolumeUpCommand,GarageUpCommand,StereoVolumeUpCommand,StereoVolumeUpCommand,LightOffCommand,StereoOffCommand,GarageDownCommand,LightOnCommand,StereoOnCommand,StereoPlayCDCommand,StereoVolumeUpCommand,StereoVolumeDownCommand,GarageUpCommand,StereoVolumeDownCommand,LightOffCommand,StereoOffCommand
macro.testLongTask.off.commands=StereoStopPlaybackCommand,StereoOffCommand,LightOffCommand,GarageDownCommand,StereoVolumeDownCommand,StereoVolumeDownCommand,LightOffCommand,StereoOffCommand,GarageDownCommand,LightOnCommand,StereoOnCommand,StereoPlayCDCommand,StereoVolumeUpCommand,StereoVolumeUpCommand,GarageUpCommand,StereoVolumeUpCommand,StereoVolumeUpCommand,LightOffCommand,StereoOffCommand,GarageDownCommand
# All slots reference command IDs uniformly (macro or regular)
# Format: slot.<n>.on=<CommandClassName or MacroId_On>
# Format: slot.<n>.off=<CommandClassName or MacroId_Off>

# Slot 0: Light Control
slot.0.on=LightOnCommand
slot.0.off=LightOffCommand

# Slot 1: Garage Door Control
slot.1.on=GarageUpCommand
slot.1.off=GarageDownCommand

# Slot 2: Stereo Power Control
slot.2.on=StereoOnCommand
slot.2.off=StereoOffCommand

# Slot 3: Volume Control
slot.3.on=StereoVolumeUpCommand
slot.3.off=StereoVolumeDownCommand

# Slot 4: Playback Control
slot.4.on=StereoPlayCDCommand
slot.4.off=StereoStopPlaybackCommand

# Slot 5: Party Mode (Macro)
slot.5.on=partyMode_On
slot.5.off=partyMode_Off

# Slot 6: Movie Night (Macro)
slot.6.on=movieNight_On
slot.6.off=movieNight_Off

# Slot 7: All Off (Macro)
slot.7.on=allOff_On
slot.7.off=allOff_Off

# Slot 8: 20-Step Test Macro (5 seconds total - tests progress visualization)
slot.8.on=testLongTask_On
slot.8.off=testLongTask_Off
