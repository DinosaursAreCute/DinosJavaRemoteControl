# Remote Control Configuration
# Number of slots/buttons on the remote
remote.slots.count=20

# Command Execution Settings
# Duration for each command execution in milliseconds (for progress tracking)
command.duration.ms=250

# Slot 0: Light Control
slot.0.on=LightOnCommand
slot.0.off=LightOffCommand

# Slot 1: Garage Door Control
slot.1.on=GarageUpCommand
slot.1.off=GarageDownCommand

# Slot 2: Stereo Power Control
slot.2.on=StereoOnCommand
slot.2.off=StereoOffCommand

# Slot 3: Volume Control
slot.3.on=StereoVolumeUpCommand
slot.3.off=StereoVolumeDownCommand

# Slot 4: Playback Control
slot.4.on=StereoPlayCDCommand
slot.4.off=StereoStopPlaybackCommand

# Format: slot.X.on.macro=Command1,Command2,Command3
# Format: slot.X.off.macro=Command1,Command2,Command3
slot.5.name=Party Mode
slot.5.on.macro=LightOnCommand,StereoOnCommand,StereoPlayCDCommand
slot.5.off.macro=StereoStopPlaybackCommand,StereoOffCommand,LightOffCommand

slot.6.name=Movie Night
slot.6.on.macro=LightOnCommand,StereoOnCommand,StereoPlayCDCommand
slot.6.off.macro=StereoStopPlaybackCommand,StereoOffCommand,LightOffCommand

slot.7.name=All Off
slot.7.on.macro=LightOffCommand,StereoOffCommand,GarageDownCommand
slot.7.off.macro=LightOnCommand,StereoOnCommand,GarageUpCommand


